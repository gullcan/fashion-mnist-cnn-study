[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-mnist-cnn-study"
version = "0.2.0"
description = "A small CNN study with explicit training, evaluation and error analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy==2.5.2",
    "matplotlib==3.11.2",
    "pillow==12.3.0",
]

[project.scripts]
fashion-cnn = "fashion_cnn.cli:main"

[tool.setuptools.packages.find]
include = ["fashion_cnn*"]
